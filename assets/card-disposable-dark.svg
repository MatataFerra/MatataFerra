<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 280" width="600" height="280" role="img" aria-label="disposable-check — Detects throwaway email addresses before they reach your sign-up form.">
<title>disposable-check — Detects throwaway email addresses before they reach your sign-up form.</title>
<defs>
  <g id="bdis" opacity="0.38"><circle cx="330" cy="238" r="216" fill="#4F46E5"><animateTransform attributeName="transform" type="translate" values="0 0; 28 -22; 0 0" dur="27s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="570" cy="252" r="132" fill="#A855F7"><animateTransform attributeName="transform" type="translate" values="0 0; -24 -16; 0 0" dur="21s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="108" cy="84" r="204" fill="#7C3AED"><animateTransform attributeName="transform" type="translate" values="0 0; 40 18; 0 0" dur="19s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="468" cy="70" r="180" fill="#DB2777"><animateTransform attributeName="transform" type="translate" values="0 0; -36 24; 0 0" dur="23s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle></g>
  <filter id="softdis" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="frostdis" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
  <filter id="graindis"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0"/></filter>
  <clipPath id="clipdis"><rect x="14" y="14" width="572" height="252" rx="22"/></clipPath>
  <linearGradient id="sheendis" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.132"/>
    <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edgedis" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.256"/>
    <stop offset=".5" stop-color="#fff" stop-opacity="0.064"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0.16"/>
  </linearGradient>
</defs>
<rect width="600" height="280" rx="24" fill="#0A0A10"/>
<g clip-path="url(#outerdis)"><use href="#bdis" filter="url(#softdis)"/></g>
<clipPath id="outerdis"><rect width="600" height="280" rx="24"/></clipPath>
<g clip-path="url(#clipdis)">
  <rect x="14" y="14" width="572" height="252" fill="#0A0A10" opacity="0.35"/>
  <use href="#bdis" filter="url(#frostdis)"/>
  <rect x="14" y="14" width="572" height="252" fill="#FFFFFF" fill-opacity="0.045"/>
  <rect x="14" y="14" width="572" height="252" fill="url(#sheendis)"/>
</g>
<rect x="14.5" y="14.5" width="571" height="251" rx="22" fill="none" stroke="url(#edgedis)"/>
<rect width="600" height="280" rx="24" filter="url(#graindis)" opacity="0.07"/>

<text x="46" y="70" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#A7A1B8">LIBRARY · TYPESCRIPT</text>
<g font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#A7A1B8">
  <rect x="439" y="52" width="115" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity=".12"/>
  <circle cx="455" cy="65" r="3.5" fill="#A5B4FC">
    <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="465" y="69">In progress</text>
</g>
<text x="44" y="118" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif" font-size="36" fill="#F4F1FA" letter-spacing="-.5">disposable-check</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" fill="#A7A1B8"><text x="46" y="150">Detects throwaway email addresses before they reach</text><text x="46" y="174">your sign-up form.</text></g>
<g font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#F4F1FA" fill-opacity=".8"><rect x="46" y="206" width="98" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity=".12"/><text x="95" y="223.5" text-anchor="middle">TypeScript</text><rect x="152.0" y="206" width="75" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity=".12"/><text x="190" y="223.5" text-anchor="middle">Node.js</text><rect x="235.2" y="206" width="45" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity=".12"/><text x="258" y="223.5" text-anchor="middle">npm</text></g>

</svg>