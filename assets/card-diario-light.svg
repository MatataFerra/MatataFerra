<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 280" width="600" height="280" role="img" aria-label="El Diario de Mati — Stories, travel and culture — my personal blog, with a hand-built editorial design system.">
<title>El Diario de Mati — Stories, travel and culture — my personal blog, with a hand-built editorial design system.</title>
<defs>
  <g id="bdia" opacity="0.85"><circle cx="468" cy="70" r="180" fill="#F9A8D4"><animateTransform attributeName="transform" type="translate" values="0 0; -36 24; 0 0" dur="23s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="330" cy="238" r="216" fill="#A5B4FC"><animateTransform attributeName="transform" type="translate" values="0 0; 28 -22; 0 0" dur="27s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="570" cy="252" r="132" fill="#D8B4FE"><animateTransform attributeName="transform" type="translate" values="0 0; -24 -16; 0 0" dur="21s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="108" cy="84" r="204" fill="#C4B5FD"><animateTransform attributeName="transform" type="translate" values="0 0; 40 18; 0 0" dur="19s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle></g>
  <filter id="softdia" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="frostdia" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
  <filter id="graindia"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0"/></filter>
  <clipPath id="clipdia"><rect x="14" y="14" width="572" height="252" rx="22"/></clipPath>
  <linearGradient id="sheendia" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
    <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edgedia" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
    <stop offset=".5" stop-color="#fff" stop-opacity="0.36000000000000004"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
  </linearGradient>
</defs>
<rect width="600" height="280" rx="24" fill="#F6F4FA"/>
<g clip-path="url(#outerdia)"><use href="#bdia" filter="url(#softdia)"/></g>
<clipPath id="outerdia"><rect width="600" height="280" rx="24"/></clipPath>
<g clip-path="url(#clipdia)">
  <rect x="14" y="14" width="572" height="252" fill="#F6F4FA" opacity="0.2"/>
  <use href="#bdia" filter="url(#frostdia)"/>
  <rect x="14" y="14" width="572" height="252" fill="#FFFFFF" fill-opacity="0.55"/>
  <rect x="14" y="14" width="572" height="252" fill="url(#sheendia)"/>
</g>
<rect x="14.5" y="14.5" width="571" height="251" rx="22" fill="none" stroke="url(#edgedia)"/>
<rect width="600" height="280" rx="24" filter="url(#graindia)" opacity="0.05"/>

<text x="46" y="70" font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="3" fill="#5B5569">BLOG · TRAVEL WRITING</text>
<g font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#5B5569">
  <rect x="490" y="52" width="64" height="26" rx="13" fill="#16131F" fill-opacity="0.05" stroke="#16131F" stroke-opacity=".12"/>
  <circle cx="506" cy="65" r="3.5" fill="#DB2777">
    <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="516" y="69">Live</text>
</g>
<text x="44" y="118" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif" font-size="36" fill="#16131F" letter-spacing="-.5">El Diario de Mati</text>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="16" fill="#5B5569"><text x="46" y="150">Stories, travel and culture — my personal blog, with</text><text x="46" y="174">a hand-built editorial design system.</text></g>
<g font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="12" fill="#16131F" fill-opacity=".8"><rect x="46" y="206" width="60" height="26" rx="13" fill="#16131F" fill-opacity="0.05" stroke="#16131F" stroke-opacity=".12"/><text x="76" y="223.5" text-anchor="middle">Astro</text><rect x="114.0" y="206" width="83" height="26" rx="13" fill="#16131F" fill-opacity="0.05" stroke="#16131F" stroke-opacity=".12"/><text x="155" y="223.5" text-anchor="middle">Svelte 5</text><rect x="204.8" y="206" width="83" height="26" rx="13" fill="#16131F" fill-opacity="0.05" stroke="#16131F" stroke-opacity=".12"/><text x="246" y="223.5" text-anchor="middle">Tailwind</text><rect x="295.6" y="206" width="98" height="26" rx="13" fill="#16131F" fill-opacity="0.05" stroke="#16131F" stroke-opacity=".12"/><text x="345" y="223.5" text-anchor="middle">Nanostores</text></g>

</svg>