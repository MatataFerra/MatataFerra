<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Matias Ferraro — Writer, Developer, Blogger">
<title>Matias Ferraro — Writer, Developer, Blogger</title>
<defs>
  <g id="bh" opacity="0.38"><circle cx="216" cy="120" r="408" fill="#7C3AED"><animateTransform attributeName="transform" type="translate" values="0 0; 40 18; 0 0" dur="19s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="936" cy="100" r="360" fill="#DB2777"><animateTransform attributeName="transform" type="translate" values="0 0; -36 24; 0 0" dur="23s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="660" cy="340" r="432" fill="#4F46E5"><animateTransform attributeName="transform" type="translate" values="0 0; 28 -22; 0 0" dur="27s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle><circle cx="1140" cy="360" r="264" fill="#A855F7"><animateTransform attributeName="transform" type="translate" values="0 0; -24 -16; 0 0" dur="21s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></circle></g>
  <filter id="softh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="frosth" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="96"/></filter>
  <filter id="grainh"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0"/></filter>
  <clipPath id="cliph"><rect x="56" y="56" width="1088" height="288" rx="28"/></clipPath>
  <linearGradient id="sheenh" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.132"/>
    <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="edgeh" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.256"/>
    <stop offset=".5" stop-color="#fff" stop-opacity="0.064"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0.16"/>
  </linearGradient>
</defs>
<rect width="1200" height="400" rx="24" fill="#0A0A10"/>
<g clip-path="url(#outerh)"><use href="#bh" filter="url(#softh)"/></g>
<clipPath id="outerh"><rect width="1200" height="400" rx="24"/></clipPath>
<g clip-path="url(#cliph)">
  <rect x="56" y="56" width="1088" height="288" fill="#0A0A10" opacity="0.35"/>
  <use href="#bh" filter="url(#frosth)"/>
  <rect x="56" y="56" width="1088" height="288" fill="#FFFFFF" fill-opacity="0.045"/>
  <rect x="56" y="56" width="1088" height="288" fill="url(#sheenh)"/>
</g>
<rect x="56.5" y="56.5" width="1087" height="287" rx="28" fill="none" stroke="url(#edgeh)"/>
<rect width="1200" height="400" rx="24" filter="url(#grainh)" opacity="0.07"/>

<g font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="4" fill="#A7A1B8">
  <text x="112" y="128">WRITER <tspan fill="#6E6880">/</tspan> DEVELOPER <tspan fill="#6E6880">/</tspan> BLOGGER</text>
</g>
<text x="108" y="218" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif" font-size="76" fill="#F4F1FA" letter-spacing="-1.5">Matias Ferraro</text>
<text x="112" y="268" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif" font-style="italic" font-size="24" fill="#A7A1B8">I build things for the web and write things for the soul.</text>
<g font-family="ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="15" fill="#A7A1B8">
  <text x="1088" y="300" text-anchor="end">~/code &amp;&amp; prose</text>
  <rect x="1094" y="287" width="9" height="17" rx="1.5" fill="#C4B5FD">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</g>
<line x1="112" y1="300" x2="172" y2="300" stroke="#F4F1FA" stroke-opacity=".35" stroke-width="1.5"/>

</svg>